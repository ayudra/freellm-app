<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#07090f">
<title>FreeLLM Studio</title>
<style>
:root{
  --bg:#07090f; --bg2:#0d111b; --surface:#131928; --surface2:#1a2236; --border:#232d45;
  --text:#eaf0fb; --muted:#8793ad; --accent:#38bdf8; --accent2:#818cf8; --gold:#fbbf24; --danger:#f87171; --ok:#34d399;
  --codebg:#05070d; --codefg:#c7d7f0; --glow:rgba(56,189,248,.22); --aurora:.55;
  --grad:linear-gradient(135deg,#38bdf8,#818cf8); --ubg:linear-gradient(135deg,#2563eb,#4f46e5);
  --fs:15px; --r:16px; --safe-b:env(safe-area-inset-bottom,0px);
}
html[data-theme="amoled"]{--bg:#000;--bg2:#000;--surface:#0b0e14;--surface2:#131823;--border:#1b2231;--codebg:#04060a;--aurora:.35}
html[data-theme="light"]{
  --bg:#f5f7fc;--bg2:#ffffff;--surface:#ffffff;--surface2:#eef2f9;--border:#dde4f0;--text:#0f172a;--muted:#64748b;
  --accent:#0284c7;--accent2:#4f46e5;--codebg:#f1f5f9;--codefg:#1e293b;--glow:rgba(2,132,199,.18);--aurora:.28;
  --ubg:linear-gradient(135deg,#2563eb,#4f46e5);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  height:100dvh;overflow:hidden;display:flex;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:var(--aurora);z-index:0;
  background:radial-gradient(600px 380px at 85% -5%,rgba(99,102,241,.35),transparent 70%),
             radial-gradient(520px 340px at -5% 8%,rgba(56,189,248,.28),transparent 70%)}
button{font-family:inherit;color:inherit;cursor:pointer}
svg{display:block}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}

/* ===== layout ===== */
.main{position:relative;z-index:1;flex:1;min-width:0;height:100dvh;display:flex;flex-direction:column}
header{height:56px;flex-shrink:0;padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);position:relative;z-index:5}
.ibtn{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.ibtn:active{transform:scale(.92);background:var(--surface2)}
.ibtn svg{width:19px;height:19px}
.pill{display:flex;align-items:center;gap:8px;max-width:62vw;padding:8px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border);font-size:13.5px;font-weight:600;transition:.15s}
.pill:active{transform:scale(.97)}
.pill span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill svg{width:14px;height:14px;opacity:.6;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0;box-shadow:0 0 0 3px transparent;transition:.3s}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(248,113,113,.18)}

#chat{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 20px;display:flex;flex-direction:column;gap:20px;position:relative}
.wrapc{width:100%;max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* ===== welcome ===== */
.welcome{margin:auto;width:100%;max-width:520px;text-align:center;padding:12px 4px;animation:rise .5s ease}
.logo{width:64px;height:64px;border-radius:20px;margin:0 auto 16px;display:grid;place-items:center;font-size:28px;background:var(--grad);
  box-shadow:0 10px 40px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.welcome h2{font-size:24px;letter-spacing:-.3px;margin-bottom:6px}
.welcome p{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:22px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.pcard{padding:13px;border-radius:14px;background:var(--surface);border:1px solid var(--border);font-size:13px;line-height:1.4;transition:.15s}
.pcard b{display:block;font-size:13.5px;margin-bottom:3px}
.pcard small{color:var(--muted);font-size:12px}
.pcard:active{transform:scale(.97);border-color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== messages ===== */
.msg{display:flex;gap:10px;animation:rise .25s ease;width:100%;max-width:820px;margin:0 auto}
.msg.user{flex-direction:column;align-items:flex-end;gap:6px}
.ub{max-width:88%;padding:11px 15px;border-radius:20px 20px 6px 20px;background:var(--ubg);color:#fff;font-size:var(--fs);line-height:1.55;
  white-space:pre-wrap;word-wrap:break-word;box-shadow:0 6px 22px rgba(37,99,235,.25)}
.uchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:88%}
.achip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--border);font-size:12px;color:var(--muted);max-width:220px}
.achip b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:600}
.uact{display:flex;gap:2px;opacity:.75}
.msg.ai{align-items:flex-start}
.av{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;font-size:14px;flex-shrink:0;margin-top:2px;box-shadow:0 4px 14px var(--glow)}
.mc{min-width:0;flex:1}
.meta{font-size:12px;font-weight:600;color:var(--muted);margin:4px 0 6px;letter-spacing:.2px}
.body{font-size:var(--fs);line-height:1.68;word-wrap:break-word;overflow-wrap:anywhere}
.body>*+*{margin-top:.75em}
.body h1,.body h2,.body h3,.body h4{line-height:1.3;letter-spacing:-.2px;margin-top:1.1em}
.body h1{font-size:1.4em}.body h2{font-size:1.25em}.body h3{font-size:1.1em}.body h4{font-size:1em;color:var(--muted)}
.body ul,.body ol{padding-left:22px}.body li{margin:3px 0;padding-left:2px}
.body li::marker{color:var(--accent)}
.body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.body blockquote{border-left:3px solid var(--accent2);padding:2px 0 2px 12px;color:var(--muted)}
.body hr{border:none;border-top:1px solid var(--border);margin:1.2em 0}
.body code{background:var(--surface2);padding:2px 6px;border-radius:6px;font:0.88em ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
.tbl table{border-collapse:collapse;width:100%;font-size:.92em}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.tbl th{background:var(--surface);font-weight:700}.tbl tr:last-child td{border-bottom:none}
.dots{display:flex;gap:5px;padding:10px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:bl 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}

.think{border:1px solid var(--border);background:var(--surface);border-radius:12px;margin-bottom:10px;overflow:hidden}
.think summary{list-style:none;padding:9px 12px;font-size:12.5px;font-weight:600;color:var(--gold);cursor:pointer;display:flex;align-items:center;gap:8px}
.think summary::-webkit-details-marker{display:none}
.think summary::before{content:"💭"}
.think-c{padding:2px 12px 12px;font-size:12.5px;line-height:1.6;color:var(--muted);white-space:pre-wrap;max-height:260px;overflow:auto;border-top:1px solid var(--border);padding-top:10px}

.foot{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:26px}
.stats{font-size:11px;color:var(--muted);margin-right:6px}
.fbtn{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;border:none;background:none;color:var(--muted);font-size:12px;font-weight:600;transition:.15s}
.fbtn:active,.fbtn:hover{background:var(--surface);color:var(--text)}
.errbox{padding:12px 14px;border-radius:14px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.35);font-size:13.5px;line-height:1.55}
.errbox button{margin-top:10px;padding:8px 14px;border-radius:10px;border:none;background:var(--danger);color:#1a0505;font-weight:700}

/* ===== code + file cards ===== */
.cb{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--codebg)}
.cb-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 12px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.cb-h button{background:none;border:none;color:var(--muted);font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:7px;text-transform:none}
.cb-h button:active{background:var(--surface2)}
.cb pre{padding:12px 14px;overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--codefg);tab-size:2}
.cb pre code{background:none;padding:0;color:inherit;font:inherit}
.fcard{display:flex;align-items:center;gap:12px;padding:11px;border-radius:16px;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden;cursor:pointer;transition:.15s}
.fcard:active{transform:scale(.985)}
.fcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--grad)}
.fcard.writing::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:var(--grad);animation:slide 1.2s infinite ease-in-out}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.fc-ic{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.fc-info{flex:1;min-width:0}
.fc-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.fc-btns{display:flex;gap:6px;flex-shrink:0}
.fb{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.fb.pri{background:var(--grad);border-color:transparent;color:#04101c}
.fb:active{transform:scale(.92)}
.fb svg{width:16px;height:16px}
.dl-all{align-self:flex-start;padding:9px 14px;border-radius:12px;border:1px dashed var(--accent);background:transparent;color:var(--accent);font-weight:700;font-size:13px}
@media(max-width:420px){.fc-btns .hide-s{display:none}}

/* ===== composer ===== */
.input-wrap{position:relative;z-index:3;padding:8px 12px calc(10px + var(--safe-b));flex-shrink:0}
.composer{max-width:820px;margin:0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:22px;padding:8px;box-shadow:0 10px 40px rgba(0,0,0,.25);transition:.2s}
.composer:focus-within{border-color:var(--accent);box-shadow:0 10px 40px rgba(0,0,0,.25),0 0 0 3px var(--glow)}
.attach-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px 4px 8px}
.attach-row:empty{display:none}
.attach-row .achip{background:var(--surface2)}
.attach-row .achip button{background:none;border:none;color:var(--muted);font-size:14px;line-height:1}
.crow{display:flex;align-items:flex-end;gap:6px}
textarea{flex:1;background:transparent;border:none;color:var(--text);font:inherit;font-size:15.5px;line-height:1.45;resize:none;max-height:140px;padding:9px 4px;outline:none}
textarea::placeholder{color:var(--muted)}
.send{width:40px;height:40px;border-radius:14px;border:none;background:var(--grad);color:#04101c;display:grid;place-items:center;flex-shrink:0;transition:.15s;box-shadow:0 4px 16px var(--glow)}
.send:active{transform:scale(.9)}
.send svg{width:20px;height:20px}
.send.stop{background:var(--gold)}
.send:disabled{opacity:.35;box-shadow:none}
.cbar{display:flex;align-items:center;gap:6px;padding:0 2px 0;margin-top:2px}
.tgl{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.tgl.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tgl svg{width:14px;height:14px}
.fab{position:absolute;right:16px;bottom:calc(100% + 6px);width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--border);display:none;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:4}
.fab.show{display:grid;animation:rise .2s}.fab svg{width:18px;height:18px;transform:rotate(90deg)}

/* ===== sidebar ===== */
.bd{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.bd.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:86vw;background:var(--bg2);border-right:1px solid var(--border);z-index:50;display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.sidebar.open{transform:none}
.sb-top{padding:14px 14px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:17px;letter-spacing:-.2px;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.newc{margin:6px 12px;padding:12px;border-radius:14px;border:none;background:var(--grad);color:#04101c;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 22px var(--glow)}
.newc:active{transform:scale(.97)}
.search{margin:8px 12px 4px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;outline:none;width:calc(100% - 24px)}
.search:focus{border-color:var(--accent)}
.clist{flex:1;overflow-y:auto;padding:4px 10px 10px}
.cgrp{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 8px 6px}
.citem{display:flex;align-items:center;gap:4px;padding:3px 4px 3px 12px;border-radius:12px;margin-bottom:2px;font-size:13.5px;color:var(--muted);transition:.12s}
.citem.active{background:var(--surface);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.ct{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:9px 0;cursor:pointer}
.cx{background:none;border:none;color:var(--muted);width:30px;height:30px;border-radius:8px;font-size:13px}
.cx:active{background:var(--surface2)}
.sb-foot{padding:10px 12px calc(12px + var(--safe-b));border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sbtn{padding:11px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:13px}
.sbtn:active{background:var(--surface2)}

/* ===== sheets ===== */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:86dvh;background:var(--bg2);border:1px solid var(--border);border-bottom:none;border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--safe-b)}
.sheet-bg.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--border);margin:10px auto 2px}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 8px;font-weight:800;font-size:17px}
.sh-b{overflow-y:auto;padding:4px 14px 18px}
.sh-s{margin:4px 14px 8px;padding:11px 13px;width:calc(100% - 28px);border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;outline:none}
.sh-s:focus{border-color:var(--accent)}
.mgrp{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:12px 4px 6px}
.mrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;margin-bottom:4px;border:1px solid transparent;cursor:pointer;transition:.12s}
.mrow:active{background:var(--surface2)}
.mrow.sel{background:color-mix(in srgb,var(--accent) 10%,transparent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.mi{flex:1;min-width:0}.mn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.star{background:none;border:none;font-size:18px;color:var(--border);padding:2px 6px}
.star.on{color:var(--gold)}
.chk{color:var(--accent);font-weight:800;width:16px;text-align:center}
.custom{display:flex;gap:8px;margin-top:12px}
.custom input{flex:1;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13.5px;outline:none}
.pbtn{padding:0 16px;border-radius:12px;border:none;background:var(--grad);color:#04101c;font-weight:800;font-size:13.5px;height:42px}
.gbtn{padding:0 16px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13.5px;height:42px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.6}
.fld{margin-bottom:14px}
.fld label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
.fld input[type=text],.fld input[type=password],.fld textarea,.fld select{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-size:14px;outline:none}
.fld textarea{resize:vertical;min-height:70px}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent)}
.fld input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:10px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px}
.seg button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.row2{display:flex;gap:8px;margin-top:6px}.row2>*{flex:1}
.danger{color:var(--danger)}

/* ===== file viewer ===== */
.viewer{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
.viewer.open{display:flex;animation:rise .2s}
.vh{height:56px;padding:0 10px;display:flex;align-items:center;gap:8px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.vt{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:3px}
.tabs button{padding:6px 12px;border:none;background:none;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface2);color:var(--accent)}
.vb{flex:1;position:relative;overflow:hidden}
#pf{width:100%;height:100%;border:none;background:#fff}
#cv{position:absolute;inset:0;overflow:auto;padding:14px;background:var(--codebg);color:var(--codefg);font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;tab-size:2;display:none}

#toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translate(-50%,20px);padding:10px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);font-size:13px;font-weight:600;z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="bd" id="bd"></div>
<aside class="sidebar" id="sidebar">
  <div class="sb-top"><div class="brand">⚡ FreeLLM Studio</div><button class="ibtn" id="closeSb" data-ic="close"></button></div>

/* ================= markdown ================= */
function inline(s){
  const codes=[];
  s=s.replace(/`([^`\n]+)`/g,(_,c)=>{codes.push(c);return "\u0000"+(codes.length-1)+"\u0000"});
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  s=s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");
  s=s.replace(/~~([^~\n]+)~~/g,"<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>"<code>"+codes[i]+"</code>");
}
function mdText(src,renderCode){
  const blocks=[];
  let t=src.replace(/```([^\n]*)\n([\s\S]*?)(```|$)/g,(m,info,code,end)=>{
    blocks.push({info,code:code.replace(/\n$/,""),closed:end==="```"});return "\n\u0001"+(blocks.length-1)+"\u0001\n"});
  t=t.replace(/```[^\n]*$/,m=>{blocks.push({info:m.slice(3),code:"",closed:false});return "\n\u0001"+(blocks.length-1)+"\u0001\n"});
  const lines=esc(t).split("\n");
  const HR=/^(-{3,}|\*{3,}|_{3,})\s*$/,LI=/^(\s*)([-*+]|\d+\.)\s+(.*)$/,BQ=/^&gt;\s?/,SEP=/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/;
  const special=l=>/^\u0001\d+\u0001$/.test(l)||/^#{1,4}\s/.test(l)||LI.test(l)||BQ.test(l)||HR.test(l);
  const out=[];let i=0,m;
  while(i<lines.length){
    const l=lines[i];
    if(!l.trim()){i++;continue}
    if(m=l.match(/^\u0001(\d+)\u0001$/)){out.push(renderCode(blocks[+m[1]],+m[1]));i++;continue}
    if(m=l.match(/^(#{1,4})\s+(.*)$/)){out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`);i++;continue}
    if(HR.test(l)){out.push("<hr>");i++;continue}
    if(BQ.test(l)){const q=[];while(i<lines.length&&BQ.test(lines[i])){q.push(lines[i].replace(BQ,""));i++}out.push("<blockquote>"+inline(q.join("<br>"))+"</blockquote>");continue}
    if(l.includes("|")&&i+1<lines.length&&SEP.test(lines[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const head=cells(l);i+=2;const rows=[];
      while(i<lines.length&&lines[i].trim()&&lines[i].includes("|")){rows.push(cells(lines[i]));i++}
      out.push(`<div class="tbl"><table><thead><tr>${head.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if(m=l.match(LI)){
      const ord=/\d/.test(m[2]);const items=[];let mm;
      while(i<lines.length&&(mm=lines[i].match(LI))){items.push({d:Math.min(3,Math.floor(mm[1].length/2)),t:mm[3]});i++}
      const tg=ord?"ol":"ul";
      out.push(`<${tg}>`+items.map(it=>`<li style="margin-left:${it.d*16}px">${inline(it.t)}</li>`).join("")+`</${tg}>`);
      continue;
    }
    const p=[l];i++;
    while(i<lines.length&&lines[i].trim()&&!special(lines[i])){p.push(lines[i]);i++}
    out.push("<p>"+inline(p.join("<br>"))+"</p>");
  }
  return out.join("");
}

/* ================= files ================= */
const NORM={javascript:"js",typescript:"ts",python:"py",markdown:"md",text:"txt",plaintext:"txt",shell:"sh",bash:"sh",htm:"html",yaml:"yaml",golang:"go",rust:"rs"};
const EXT={html:"html",css:"css",js:"js",ts:"ts",py:"py",json:"json",md:"md",txt:"txt",svg:"svg",sh:"sh",java:"java",cpp:"cpp",c:"c",xml:"xml",csv:"csv",yaml:"yml",yml:"yml",sql:"sql",go:"go",rs:"rs",php:"php",jsx:"jsx",tsx:"tsx"};
const ICONF={html:"🌐",css:"🎨",js:"📜",ts:"📜",jsx:"📜",tsx:"📜",py:"🐍",json:"🧾",md:"📝",txt:"📄",svg:"🖼️",csv:"📊",sh:"⌨️",sql:"🗄️",xml:"📰"};
const MIME={html:"text/html",json:"application/json",svg:"image/svg+xml",csv:"text/csv",css:"text/css",js:"text/javascript",md:"text/markdown",xml:"application/xml"};
const extOfName=n=>(n.match(/\.([A-Za-z0-9]{1,8})$/)||[])[1]?.toLowerCase()||"";
const previewable=l=>["html","svg","md"].includes(l);
function parseInfo(info){
  info=(info||"").trim();
  let lang=(info.match(/^[\w+#.\-]*/)||[""])[0].toLowerCase();
  let rest=info.slice(lang.length),fn="";
  if(/\.\w{1,8}$/.test(lang)&&!rest.trim()){fn=lang;lang=extOfName(fn)}
  else{fn=(rest.match(/([\w\-.]+\.[A-Za-z0-9]{1,8})/)||[])[1]||""}
  lang=NORM[lang]||lang;
  if(fn&&(!lang||lang==="txt")){lang=NORM[extOfName(fn)]||extOfName(fn)||lang}
  return{lang,fn:fn.replace(/[^\w.\-]/g,"_")};
}
function renderMessageMD(text,msgId){
  const used=new Set();let nfile=0;
  const html=mdText(text,(b,idx)=>{
    const {lang,fn}=parseInfo(b.info);const code=b.code;const nl=code?code.split("\n").length:0;
    const key=msgId+":"+idx;
    const isFile=!!fn||lang==="html"||lang==="svg"||nl>=15;
    if(!isFile){
      FILES[key]={code,lang,filename:"snippet."+(EXT[lang]||"txt"),file:false};
      return `<div class="cb"><div class="cb-h"><span>${esc(lang||"code")}</span><button data-act="copyf" data-k="${key}">Copy</button></div><pre><code>${esc(code)}</code></pre></div>`;
    }
    let name=fn;
    if(!name){const base={html:"index",py:"script",css:"style",js:"app"}[lang]||"file";name=base+"."+(EXT[lang]||lang||"txt")}
    if(used.has(name)){const e=extOfName(name);const b0=name.slice(0,-(e.length+1))||name;let k=2;while(used.has(`${b0}_${k}.${e}`))k++;name=`${b0}_${k}.${e}`}
    used.add(name);
    FILES[key]={code,lang,filename:name,file:true,closed:b.closed};
    if(b.closed)nfile++;
    const ext=extOfName(name)||lang;
    const pv=b.closed&&previewable(lang);
    const sub=b.closed?`${(ext||"txt").toUpperCase()} · ${nl} lines · ${fmtSize(new Blob([code]).size)}`:`Writing… ${nl} lines`;
    return `<div class="fcard ${b.closed?"":"writing"}" ${b.closed?`data-act="open" data-k="${key}"`:""}>
      <div class="fc-ic">${ICONF[ext]||ICONF[lang]||"📄"}</div>
      <div class="fc-info"><div class="fc-name">${esc(name)}</div><div class="fc-sub">${sub}</div></div>
      ${b.closed?`<div class="fc-btns">${pv?`<button class="fb pri" data-act="open" data-k="${key}" data-mode="preview">Preview</button>`:`<button class="fb hide-s" data-act="open" data-k="${key}" data-mode="code">Code</button>`}
      <button class="fb" data-act="copyf" data-k="${key}" data-ic="copy" title="Copy">${ICON.copy}</button>
      <button class="fb" data-act="dl" data-k="${key}" title="Download">${ICON.dl}</button></div>`:""}
    </div>`;
  });
  return html+(nfile>=2?`<button class="dl-all" data-act="zip" data-m="${msgId}">📦 Download all ${nfile} files (.zip)</button>`:"");
}
function download(name,content,type){
  const blob=content instanceof Blob?content:new Blob([content],{type:(type||MIME[extOfName(name)]||"text/plain")+";charset=utf-8"});
  if(window.AndroidBridge){
    const fr=new FileReader();
    fr.onload=()=>{try{AndroidBridge.saveFile(name,String(fr.result).split(",")[1]||"");toast("Saved to Downloads/FreeLLM: "+name);buzz(10)}catch(e){toast("Save failed")}};
    fr.readAsDataURL(blob);return;
  }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast("Saved "+name);buzz(10);
}
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function zipBlob(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
  const dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1);
  for(const f of files){
    const nb=enc.encode(f.filename),db=enc.encode(f.code),crc=crc32(db);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,db.length,true);lh.setUint32(22,db.length,true);lh.setUint16(26,nb.length,true);lh.setUint16(28,0,true);
    parts.push(lh.buffer,nb,db);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,db.length,true);ch.setUint32(24,db.length,true);ch.setUint16(28,nb.length,true);
    ch.setUint32(42,off,true);
    cen.push(ch.buffer,nb);off+=30+nb.length+db.length;
  }
  let cs=0;for(const c of cen)cs+=c.byteLength;
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e.buffer],{type:"application/zip"});
}

/* ================= viewer ================= */
let curFile=null,viewMode="preview";
function srcFor(f){
  if(f.lang==="svg")return `<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><body style="margin:0;display:grid;place-items:center;min-height:100vh;background:#fff">${f.code}</body>`;
  if(f.lang==="md")return `<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><style>body{font:16px/1.65 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:20px;color:#111}pre{background:#f3f4f6;padding:12px;border-radius:8px;overflow:auto}code{background:#f3f4f6;padding:1px 5px;border-radius:4px}table{border-collapse:collapse}td,th{border:1px solid #ddd;padding:6px 10px}blockquote{border-left:3px solid #ccc;margin:0;padding-left:12px;color:#555}</style>`+mdText(f.code,b=>`<pre><code>${esc(b.code)}</code></pre>`);
  return f.code;
}
function openFile(key,mode){

  $("#vName").textContent=f.filename;$("#vSub").textContent=`${f.code.split("\n").length} lines · ${fmtSize(new Blob([f.code]).size)}`;

  setMode(pv&&mode!=="code"?"preview":"code");
  $("#viewer").classList.add("open");buzz(6);

function setMode(m){

document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));

function groupOf(ts){const s=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();const diff=(s(new Date())-s(new Date(ts)))/864e5;return diff<=0?"Today":diff<=1?"Yesterday":diff<=7?"Last 7 days":"Older"}
function renderSidebar(){
  const q=$("#chatSearch").value.trim().toLowerCase();const list=$("#clist");list.innerHTML="";
  const sorted=[...chats].sort((a,b)=>b.ts-a.ts).filter(c=>!q||c.title.toLowerCase().includes(q)||c.messages.some(m=>m.content.toLowerCase().includes(q)));
  if(!sorted.length){list.innerHTML='<div class="empty">No chats yet</div>';return}
  let last="";
  sorted.forEach(c=>{
    const g=groupOf(c.ts);if(g!==last){const h=document.createElement("div");h.className="cgrp";h.textContent=g;list.appendChild(h);last=g}
    const d=document.createElement("div");d.className="citem"+(c.id===activeId?" active":"");
    d.innerHTML=`<span class="ct">${esc(c.title)}</span><button class="cx" data-r title="Rename">✎</button><button class="cx" data-d title="Delete">✕</button>`;
    d.querySelector(".ct").onclick=()=>{if(busy)return toast("Wait for the reply to finish");activeId=c.id;saveChats();renderChat();closeSb()};
    d.querySelector("[data-r]").onclick=()=>{const t=prompt("Rename chat",c.title);if(t&&t.trim()){c.title=t.trim().slice(0,60);saveChats();renderSidebar()}};
    d.querySelector("[data-d]").onclick=()=>{if(!confirm("Delete this chat?"))return;chats=chats.filter(x=>x.id!==c.id);if(activeId===c.id){activeId=chats[0]?.id||null;renderChat()}saveChats();renderSidebar()};
    list.appendChild(d);
  });
}

$("#exportChat").onclick=()=>{

/* ================= models ================= */
const AUTOS=[{id:"auto",n:"Auto",d:"Best available model, picked for you"},{id:"auto:fast",n:"Auto · Fast",d:"Lowest latency answers"},{id:"auto:smart",n:"Auto · Smart",d:"Strongest reasoning"}];
function groupOfModel(m){
  if(m.id.includes("/"))return m.id.split("/")[0];
  const id=m.id.toLowerCase();
  const map=[[/gemini|gemma/,"Google"],[/llama/,"Meta"],[/mistral|mixtral|codestral|ministral/,"Mistral"],[/gpt|^o\d|openai/,"OpenAI"],[/deepseek/,"DeepSeek"],[/qwen|qwq/,"Qwen"],[/claude/,"Anthropic"],[/command|cohere/,"Cohere"],[/phi/,"Microsoft"]];
  for(const [r,g] of map)if(r.test(id))return g;
  return (typeof m.owned_by==="string"&&m.owned_by&&m.owned_by!=="system"&&m.owned_by!=="organization")?m.owned_by:"Other";
}
function renderModels(){
  const q=$("#modelSearch").value.trim().toLowerCase();const el=$("#modelList");
  const row=(id,n,d)=>`<div class="mrow ${cfg.model===id?"sel":""}" data-id="${esc(id)}"><div class="mi"><div class="mn">${esc(n)}</div><div class="ms">${esc(d)}</div></div><button class="star ${cfg.favs.includes(id)?"on":""}" data-fav="${esc(id)}">★</button><span class="chk">${cfg.model===id?"✓":""}</span></div>`;
  let h="";
  const autos=AUTOS.filter(a=>!q||a.n.toLowerCase().includes(q)||a.id.includes(q));
  if(autos.length)h+=`<div class="mgrp">Smart routing</div>`+autos.map(a=>row(a.id,a.n,a.d)).join("");
  const real=models.filter(m=>!m.id.startsWith("auto")&&(!q||m.id.toLowerCase().includes(q)));
  const favs=real.filter(m=>cfg.favs.includes(m.id));
  if(favs.length)h+=`<div class="mgrp">⭐ Favorites</div>`+favs.map(m=>row(m.id,shortName(m.id),m.id)).join("");
  const groups={};real.forEach(m=>{(groups[groupOfModel(m)]=groups[groupOfModel(m)]||[]).push(m)});
  Object.keys(groups).sort().forEach(g=>{h+=`<div class="mgrp">${esc(g)} · ${groups[g].length}</div>`+groups[g].map(m=>row(m.id,shortName(m.id),m.id)).join("")});
  if(!real.length&&!q)h+=`<div class="empty">No models loaded from the server yet.<br>Check Settings → Test connection, or enter a model ID below.</div>`;
  if(q&&!autos.length&&!real.length)h+=`<div class="empty">No match for “${esc(q)}”.</div>`;
  h+=`<div class="mgrp">Custom model ID</div><div class="custom"><input id="customModel" placeholder="e.g. gemini-2.0-flash" autocapitalize="off" autocorrect="off"><button class="pbtn" id="useCustom">Use</button></div>`;
  el.innerHTML=h;
}
$("#modelPill").onclick=()=>{$("#modelSearch").value="";renderModels();openSheet("modelSheet");loadModels(true)};

$("#modelList").addEventListener("click",e=>{
  const st=e.target.closest("[data-fav]");
  if(st){e.stopPropagation();const id=st.dataset.fav;cfg.favs=cfg.favs.includes(id)?cfg.favs.filter(x=>x!==id):[...cfg.favs,id];saveCfg();renderModels();buzz(6);return}
  if(e.target.closest("#useCustom")){const v=$("#customModel").value.trim();if(v)pickModel(v);return}
  const r=e.target.closest(".mrow");if(r)pickModel(r.dataset.id);
});
function pickModel(id){cfg.model=id;saveCfg();syncUI();closeSheet("modelSheet");toast("Model: "+shortName(id));buzz(10)}
async function loadModels(silent){
  try{
    const res=await fetch(cfg.url.replace(/\/$/,"")+"/v1/models",{headers:{Authorization:"Bearer "+cfg.key}});
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(data&&Array.isArray(data.data)){models=data.data.map(m=>({id:m.id,owned_by:m.owned_by}));LS.set("fs2_models",models)}
    $("#srvDot").className="dot ok";
    if($("#modelSheet").classList.contains("open"))renderModels();
    return models.length;
  }catch(e){$("#srvDot").className="dot bad";return -1}
}

/* ================= chat rendering ================= */
const chatEl=$("#chat");
function splitThink(content,reasoning){
  let think=reasoning||"",ans=content||"";
  const m=ans.match(/<think>([\s\S]*?)(<\/think>|$)/i);
  if(m){think=(think?think+"\n":"")+m[1].trim();ans=ans.replace(/<think>[\s\S]*?(<\/think>|$)/i,"").trim()}
  return{think:think.trim(),ans};
}
function wrap(){let w=chatEl.querySelector(".wrapc");if(!w){w=document.createElement("div");w.className="wrapc";chatEl.innerHTML="";chatEl.appendChild(w)}return w}
function userEl(m){
  const d=document.createElement("div");d.className="msg user";d.dataset.id=m.id;
  const chips=(m.attach||[]).map(a=>`<div class="achip">📎 <b>${esc(a.name)}</b></div>`).join("");
  d.innerHTML=`<div class="ub">${esc(m.content)}</div>${chips?`<div class="uchips">${chips}</div>`:""}<div class="uact"><button class="fbtn" data-act="copymsg" data-id="${m.id}">Copy</button><button class="fbtn" data-act="edit" data-id="${m.id}">Edit</button></div>`;
  return d;
}
function aiEl(m){
  const d=document.createElement("div");d.className="msg ai";d.dataset.id=m.id;
  d.innerHTML=`<div class="av">⚡</div><div class="mc"><div class="meta"><span class="mn2"></span></div><details class="think" hidden><summary><span class="tl">Thinking…</span></summary><div class="think-c"></div></details><div class="body"></div><div class="foot"></div></div>`;
  return d;
}
function paintAI(el,m,streaming,isLast){
  el.querySelector(".mn2").textContent=shortName(m.meta||cfg.model);
  const {think,ans}=splitThink(m.content,m.reasoning);
  const th=el.querySelector(".think");th.hidden=!think;
  if(think){el.querySelector(".think-c").textContent=think;el.querySelector(".tl").textContent=streaming&&!ans?"Thinking…":"Thought process"+(m.thinkSecs?` · ${m.thinkSecs}s`:"")}
  const body=el.querySelector(".body");
  body.innerHTML=ans?renderMessageMD(ans,m.id):(streaming?'<div class="dots"><i></i><i></i><i></i></div>':"");
  const foot=el.querySelector(".foot");
  if(streaming){foot.innerHTML="";return}
  const s=m.stats;
  foot.innerHTML=(s?`<span class="stats">${s.sec}s · ~${s.tok} tok · ${s.tps} t/s</span>`:"")+
    `<button class="fbtn" data-act="copymsg" data-id="${m.id}">${ICON.copy.replace("<svg","<svg width=14 height=14")} Copy</button>`+
    (isLast?`<button class="fbtn" data-act="regen">${ICON.refresh.replace("<svg","<svg width=14 height=14")} Retry</button>`:"");
}
function renderWelcome(){
  chatEl.innerHTML=`<div class="welcome"><div class="logo">⚡</div><h2>FreeLLM Studio</h2><p>Aapka local AI workspace. Code, webpages aur documents seedha <b>file cards</b> me milte hain — preview, download ya zip.</p>
  <div class="cards">
   <button class="pcard" data-prompt="Ek modern dark neon portfolio website banao, single index.html me"><b>🌐 Website</b><small>Portfolio page, ek HTML file</small></button>
   <button class="pcard" data-prompt="Ek Python script likho jo ek folder ki saari PDF files merge kare"><b>🐍 Python script</b><small>PDF merger tool</small></button>
   <button class="pcard" data-prompt="Class 11 Physics Newton's Laws ke short notes notes.md file me do"><b>📚 Study notes</b><small>Markdown file me</small></button>
   <button class="pcard" data-prompt="Ek todo app banao HTML, CSS aur JS alag-alag files me"><b>🧩 Multi-file app</b><small>3 files + zip download</small></button>
  </div></div>`;
}
function renderChat(){
  syncUI();const c=active();
  if(!c||!c.messages.length){renderWelcome();return}
  const w=document.createElement("div");w.className="wrapc";
  c.messages.forEach((m,i)=>{
    if(m.role==="user")w.appendChild(userEl(m));
    else{const e=aiEl(m);w.appendChild(e);paintAI(e,m,false,i===c.messages.length-1)}
  });
  chatEl.innerHTML="";chatEl.appendChild(w);scrollDown(true);
}
function scrollDown(force){if(force||stick){chatEl.scrollTop=chatEl.scrollHeight}}
chatEl.addEventListener("scroll",()=>{stick=chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight<140;$("#fab").classList.toggle("show",!stick)},{passive:true});
$("#fab").onclick=()=>{stick=true;chatEl.scrollTo({top:chatEl.scrollHeight,behavior:"smooth"})};

chatEl.addEventListener("click",e=>{
  const pc=e.target.closest(".pcard");if(pc){$("#input").value=pc.dataset.prompt;send();return}
  const b=e.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,c=active();
  if(act==="open")openFile(b.dataset.k,b.dataset.mode);
  else if(act==="copyf"){const f=FILES[b.dataset.k];if(f)copyText(f.code)}
  else if(act==="dl"){const f=FILES[b.dataset.k];if(f)download(f.filename,f.code)}
  else if(act==="zip"){const fs=Object.entries(FILES).filter(([k,v])=>k.startsWith(b.dataset.m+":")&&v.file&&v.closed).map(([,v])=>v);if(fs.length)download("project.zip",zipBlob(fs))}
  else if(act==="copymsg"){const m=c?.messages.find(x=>x.id===b.dataset.id);if(m)copyText(m.content)}
  else if(act==="regen"){if(busy||!c)return;const last=c.messages[c.messages.length-1];if(last?.role==="assistant"){c.messages.pop();saveChats()}renderChat();generate(c)}
  else if(act==="retry"){if(busy||!c)return;b.closest(".msg")?.remove();generate(c)}
  else if(act==="edit"){
    if(busy||!c)return;const i=c.messages.findIndex(x=>x.id===b.dataset.id);if(i<0)return;
    const m=c.messages[i];$("#input").value=m.content;pending=[...(m.attach||[])];renderAttach();
    c.messages=c.messages.slice(0,i);saveChats();renderChat();autosize();$("#input").focus();
  }
});

/* ================= sending / streaming ================= */
const sendBtn=$("#sendBtn"),inputEl=$("#input");
function setBusy(b){busy=b;sendBtn.classList.toggle("stop",b);sendBtn.innerHTML=b?ICON.stop:ICON.send}
function buildSystem(){return (PERSONAS[cfg.persona]?.p||PERSONAS.default.p)+(cfg.sys?"\n\n"+cfg.sys:"")+(cfg.fileMode?FILE_RULES:"")}
function apiContent(m){
  if(!m.attach||!m.attach.length)return m.content;
  return m.content+m.attach.map(a=>`\n\n[Attached file: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``).join("");
}
async function send(){
  if(busy){abortCtrl&&abortCtrl.abort();return}
  const text=inputEl.value.trim();if(!text&&!pending.length)return;
  if(!active()){const c={id:"chat_"+Date.now(),title:"New chat",ts:Date.now(),messages:[]};chats.unshift(c);activeId=c.id}
  const c=active();
  if(!c.messages.length){c.title=(text||pending[0].name).slice(0,34)+((text||"").length>34?"…":"")}
  c.ts=Date.now();
  const m={id:uid(),role:"user",content:text||"(see attached files)",attach:pending.length?[...pending]:undefined};
  c.messages.push(m);pending=[];renderAttach();
  inputEl.value="";autosize();
  if(chatEl.querySelector(".welcome"))chatEl.innerHTML="";
  wrap().querySelectorAll("[data-err]").forEach(x=>x.remove());
  wrap().appendChild(userEl(m));saveChats();stick=true;scrollDown(true);buzz(10);
  generate(c);
}
async function generate(c){
  const m={id:uid(),role:"assistant",content:"",reasoning:"",meta:cfg.model};
  wrap().querySelectorAll('[data-act="regen"]').forEach(b=>b.remove());
  const el=aiEl(m);wrap().appendChild(el);paintAI(el,m,true);stick=true;scrollDown(true);
  setBusy(true);abortCtrl=new AbortController();
  const t0=performance.now();let tThinkStart=0;
  let raf=0;const paint=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paintAI(el,m,true);scrollDown()})};
  const msgs=[{role:"system",content:buildSystem()},...c.messages.slice(-20).map(x=>({role:x.role,content:apiContent(x)}))];
  let errored=false;
  try{
    const res=await fetch(cfg.url.replace(/\/$/,"")+"/v1/chat/completions",{
      method:"POST",signal:abortCtrl.signal,
      headers:{"Content-Type":"application/json",Authorization:"Bearer "+cfg.key},
      body:JSON.stringify({model:cfg.model,stream:true,temperature:cfg.temp,messages:msgs})
    });
    if(!res.ok){let d="";try{d=(await res.text()).slice(0,200)}catch{}throw new Error("HTTP "+res.status+(d?" — "+d:""))}
    const routed=res.headers.get("x-routed-via");if(routed)m.meta=routed;
    $("#srvDot").className="dot ok";
    const reader=res.body.getReader(),dec=new TextDecoder();let buf="";
    while(true){
      const {done,value}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const line of lines){
        const tr=line.trim();if(!tr.startsWith("data:"))continue;
        const d=tr.slice(5).trim();if(d==="[DONE]")continue;
        try{
          const j=JSON.parse(d);
          if(j.model&&!routed)m.meta=j.model;
          const dl=j.choices?.[0]?.delta;
          const r=dl?.reasoning||dl?.reasoning_content;
          if(r){if(!tThinkStart)tThinkStart=performance.now();m.reasoning+=r}
          if(dl?.content){if(tThinkStart&&!m.thinkSecs)m.thinkSecs=Math.max(1,Math.round((performance.now()-tThinkStart)/1000));m.content+=dl.content}
          paint();
        }catch{}
      }
    }
  }catch(err){
    if(err.name!=="AbortError"){
      errored=true;
      el.dataset.err="1";
      el.querySelector(".body").innerHTML=`<div class="errbox"><b>⚠️ ${esc(err.message||"Connection error")}</b><br>Server <code>${esc(cfg.url)}</code> se jawab nahi aaya. Termux me <code>npm run dev -w server</code> chal raha hai? Settings me URL/key bhi check karo.<br><button data-act="retry">Retry</button></div>`;
      el.querySelector(".foot").innerHTML="";el.querySelector(".think").hidden=true;
      $("#srvDot").className="dot bad";
    }
  }finally{
    if(raf)cancelAnimationFrame(raf);
    abortCtrl=null;setBusy(false);
  }
  if(errored)return;
  if(!m.content&&!m.reasoning){el.remove();return}
  const sec=Math.max(0.1,(performance.now()-t0)/1000);
  const tok=Math.round((m.content.length+m.reasoning.length)/4);
  m.stats={sec:sec.toFixed(1),tok,tps:Math.round(tok/sec)};
  c.messages.push(m);c.ts=Date.now();saveChats();
  paintAI(el,m,false,true);scrollDown();buzz(12);
}
sendBtn.onclick=send;
function autosize(){inputEl.style.height="auto";inputEl.style.height=Math.min(inputEl.scrollHeight,140)+"px"}
inputEl.addEventListener("input",autosize);
inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();send()}
});

  return false;
};
